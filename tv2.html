<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#000000" />
  <title>Schiavoni's Market Screen 2</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
      font-family: Arial, Helvetica, sans-serif;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .slide {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: contain;
      background: #000;
    }

    .overlay {
      position: fixed;
      bottom: 2vh;
      right: 2vw;
      color: rgba(255,255,255,.75);
      font-size: 1.2vw;
      letter-spacing: .05em;
      text-shadow: 0 2px 10px rgba(0,0,0,.8);
    }
  </style>
</head>
<body>

<img
  class="slide"
  src="https://dl.dropboxusercontent.com/scl/fi/g66rkv86hew1hlxe6j9cp/Photo-May-21-2026-3-13-10-PM.png?rlkey=dn0e4usybxi6oi3i1ylk1wb0w&st=v5jauggc"
  alt="Store Promotion Screen 2"
>

<div class="overlay" id="clock"></div>

<script>
  function updateClock() {
    const now = new Date();
    document.getElementById('clock').textContent = now.toLocaleTimeString([], {
      hour: 'numeric',
      minute: '2-digit'
    });
  }

  updateClock();
  setInterval(updateClock, 1000);

  setTimeout(() => {
    location.reload();
  }, 1800000);
</script>

</body>
</html>
